    <script id="ansen-structured-data" type="application/ld+json">{"@context":"https://schema.org","@type":"Movie","name":"Trapezium","alternateName":["トラペジウム"],"description":"Motivada por uma paixão inabalável por se tornar uma ídolo, Yu Azuma, uma jovem e ambiciosa aluna do primeiro ano da Joshu East High School, decide formar um grupo de ídolos. No entanto, para transformar esse sonho em realidade, ela precisa reunir talentos de diferentes lugares. Assim, ela recruta uma garota de cada uma das quatro escolas de ensino médio de sua região: norte, leste, sul e oeste. Pouco a pouco, Yu encontra suas futuras colegas de grupo. Em primeiro lugar, há Ranko Kashima, uma sofisticada aluna do segundo ano da Holy Teneritas Southern Girls’ Academy. Com um penteado cacheado distinto, ela se destaca por sua admiração por Madame Butterfly, o que acrescenta um toque de elegância ao grupo. Além dela, há Kurumi Taiga, aluna da West Tech Vocational High School. Diferente das demais, Kurumi adora usar jaquetas fofas com mangas longas e, acima de tudo, sonha em vencer um campeonato de robótica. Por fim, Mika Kamei, aluna da Joshu North High School, é conhecida por seu bom coração e por sua dedicação ao voluntariado, o que faz dela uma peça essencial para o grupo. Com o apoio de Shinji Kudo, colaborador e confidente de Yu, essas quatro jovens embarcam, enfim, em uma jornada rumo ao estrelato. No entanto, o caminho não será nada fácil. Pelo contrário, elas enfrentarão desafios inesperados, exigências rigorosas e contratempos constantes. Dessa forma, a pressão pode ameaçar tudo pelo que Yu trabalhou tanto. Ainda assim, será que elas conseguirão superar essas dificuldades e alcançar o sucesso?","image":["https://animeq.net/wp-content/uploads/2025/02/hIbx5AvMNVLijCe3QQmVJY9jENy-212x300.jpg","https://image.tmdb.org/t/p/w300/f7L0CMVMnlV2FRlWASw9Yu6zYEQ.jpg","https://image.tmdb.org/t/p/w300/vrc0INl2Ky2Oez8TXQCswRLZlkf.jpg","https://image.tmdb.org/t/p/w300/fTprNmJWDOQLYrTQwAfey0V6tIv.jpg","ht
